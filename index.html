<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First-Person 3D Prototype</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #000;
  }
  canvas {
    display: block;
  }

  /* Crosshair: simple centered dot */
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    z-index: 10;
  }

  /* Hit marker: a small red "X" flashed briefly on a confirmed hit */
  #hit-marker {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 22px;
    height: 22px;
    margin: -11px 0 0 -11px;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
  }
  #hit-marker.visible {
    opacity: 1;
  }
  #hit-marker::before,
  #hit-marker::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 3px;
    background: #ff3b3b;
    box-shadow: 0 0 3px rgba(0, 0, 0, 0.7);
  }
  #hit-marker::before {
    transform: translate(-50%, -50%) rotate(45deg);
  }
  #hit-marker::after {
    transform: translate(-50%, -50%) rotate(-45deg);
  }

  /* "Click to play" overlay */
  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.35);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    cursor: pointer;
    z-index: 20;
    user-select: none;
  }
  #overlay.hidden {
    display: none;
  }
  #overlay .hint {
    display: block;
    font-size: 15px;
    font-weight: normal;
    margin-top: 10px;
    opacity: 0.85;
  }

  /* Wave indicator (top-center HUD) */
  #wave-hud {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: Arial, Helvetica, sans-serif;
    z-index: 10;
    pointer-events: none;
  }
  #wave-hud-text {
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }

  /* Health bar (bottom-left HUD) */
  #health-hud {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 220px;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 10;
    pointer-events: none;
  }
  #health-label {
    color: #fff;
    font-size: 13px;
    margin-bottom: 4px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  #health-bar-outer {
    width: 100%;
    height: 18px;
    background: rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 4px;
    overflow: hidden;
  }
  #health-bar-fill {
    height: 100%;
    width: 100%;
    background: #3ddc3d;
    transition: width 0.15s linear, background-color 0.15s linear;
  }

  /* Ammo counter (bottom-right HUD) */
  #ammo-hud {
    position: fixed;
    right: 20px;
    bottom: 20px;
    font-family: Arial, Helvetica, sans-serif;
    z-index: 10;
    pointer-events: none;
    text-align: right;
  }
  #ammo-text {
    color: #fff;
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
  #ammo-reserve {
    font-size: 18px;
    font-weight: normal;
    opacity: 0.75;
  }
  /* Death screen */
  #death-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(80, 0, 0, 0.75);
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    z-index: 30;
    user-select: none;
  }
  #death-screen.visible {
    display: flex;
  }
  #death-screen h1 {
    font-size: 56px;
    margin: 0 0 12px 0;
    letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
  }
  #restart-button {
    margin-top: 12px;
    padding: 10px 28px;
    font-size: 18px;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.7);
    border-radius: 6px;
    cursor: pointer;
    pointer-events: auto;
  }
  #restart-button:hover {
    background: rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body>

<div id="overlay">Click to play<span class="hint">WASD move &middot; Shift sprint &middot; Ctrl crouch/slide &middot; Space jump &middot; Mouse look &middot; Left-click fire &middot; Right-click aim &middot; R reload</span></div>
<div id="crosshair"></div>
<div id="hit-marker"></div>

<div id="wave-hud"><span id="wave-hud-text"></span></div>

<div id="health-hud">
  <div id="health-label">Health: <span id="health-text">100</span> / 100</div>
  <div id="health-bar-outer"><div id="health-bar-fill"></div></div>
</div>

<div id="ammo-hud">
  <div id="ammo-text"><span id="ammo-loaded">13</span> / <span id="ammo-reserve">36</span></div>
</div>

<div id="death-screen">
  <h1>YOU DIED</h1>
  <button id="restart-button">Restart</button>
</div>

<!-- Three.js r128, vendored locally (no build step / no bundler, no network dependency) -->
<script src="vendor/three.min.js"></script>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------
  // TUNABLE CONSTANTS
  // ------------------------------------------------------------------
  const WALK_SPEED = 6.0 * 0.85;   // top horizontal speed, units per second -- 15% slower than the original 6.0 (sprint/slide are multiples of this, so they slow down with it)
  const SPRINT_MULTIPLIER = 1.8;   // speed multiplier while Shift is held

  // Sliding: tap Ctrl (doesn't need to be held) while sprinting forward to
  // kick off a slide — a burst of speed above sprint that decays back down
  // to walk speed over a fixed duration. These are the two main knobs to
  // tune by feel:
  const SLIDE_PEAK_SPEED_MULTIPLIER = 2.0; // slide's peak speed, as a multiple of sprint speed
  const SLIDE_DECAY_DURATION = 1.2;        // seconds to decay from peak speed down to walk speed
  const SLIDE_MOUSE_SENSITIVITY_MULTIPLIER = 0.60; // mouse look is dampened by this while sliding

  const MOUSE_SENSITIVITY = 0.0022; // radians per pixel of mouse movement
  const EYE_HEIGHT = 1.7;          // camera height above ground
  const PLATFORM_SIZE = 130;       // ground plane is PLATFORM_SIZE x PLATFORM_SIZE (comfortable buffer around the floor plan -- see FLOOR_PLAN_SCALE below)
  const PLAYER_MARGIN = 0.5;       // keep camera this far from the platform edge
  const PITCH_LIMIT = Math.PI / 2 - 0.01; // just under straight up/down
  const GRAVITY = -18.0;           // units per second^2
  const JUMP_SPEED = 7.0;          // initial upward velocity on jump

  // Physics-based horizontal movement (Quake-style accelerate/friction
  // model): input steers a velocity vector instead of setting position
  // directly, so momentum, sprint transitions, and knockback all blend
  // together naturally.
  const ACCELERATION = 45;   // how fast velocity closes in on the target speed
  const FRICTION = 9;        // how fast velocity decays toward zero each second

  // Crouching (hold Ctrl): lowers eye height and caps movement speed.
  // Sprint is always disabled while crouching.
  const CROUCH_EYE_HEIGHT = 1.0;
  const CROUCH_SPEED_MULTIPLIER = 0.5;   // crouch-walk speed, relative to WALK_SPEED
  const CROUCH_TRANSITION_SPEED = 10;    // how fast eye height lerps in/out of crouch

  // Rest of the slide tuning (see SLIDE_PEAK_SPEED_MULTIPLIER/SLIDE_DECAY_DURATION
  // above, next to WALK_SPEED/SPRINT_MULTIPLIER). Sliding shares the crouch's
  // lowered eye height/pose. It's cancelled early by tapping Ctrl again (only
  // once it's been released first — holding it down doesn't cancel), by
  // jumping, or by running into an enemy; any of those (or the decay simply
  // running out) starts the cooldown, so it can't be chained for a permanent
  // speed boost.
  const SLIDE_TRIGGER_SPEED = WALK_SPEED * 1.15; // min. forward speed required to trigger (must come from sprinting)
  const SLIDE_STEER_RATE = 1.5;                  // how fast slide direction can be nudged (fraction/sec) — a nudge, not a redirect
  const SLIDE_COOLDOWN_DURATION = 0.75;          // seconds before another slide can be triggered
  const SLIDE_PEAK_SPEED = WALK_SPEED * SPRINT_MULTIPLIER * SLIDE_PEAK_SPEED_MULTIPLIER;

  const MAX_HEALTH = 100;
  const ENEMY_MAX_HEALTH = 60;          // enemy's own hit points (see WEAPON_DAMAGE below)
  const ENEMY_SPEED = 2.5;              // slower than player's walk speed
  const ENEMY_DAMAGE_PER_HIT = 10;      // damage applied per contact "tick"
  const ENEMY_HIT_INTERVAL = 0.5;       // seconds between contact damage ticks
  const ENEMY_CONTACT_DISTANCE = 1.0;   // horizontal distance that counts as "touching"
  const ENEMY_SIZE = { width: 0.6, height: 1.8, depth: 0.6 }; // roughly person-sized
  const ENEMY_TURN_SPEED = 3.0;         // radians/sec the enemy can turn — not an instant snap
  const KNOCKBACK_STRENGTH = 8.0;       // velocity impulse applied away from the enemy on hit

  // Per-enemy stat variance (see randomStatVariance, spawnEnemy below):
  // each spawned enemy's speed and size are independently offset by a
  // random +/- percentage in this range. Fixed regardless of wave number.
  const ENEMY_STAT_VARIANCE_MIN = 0.01; // 1%
  const ENEMY_STAT_VARIANCE_MAX = 0.05; // 5%

  // Waves: wave N spawns f(N) = 2N enemies, capped at MAX_ENEMIES_PER_WAVE
  // (so wave 25+ all spawn the same count), all from a randomly-picked
  // active spawner, staggered one at a time. A grace period counts down
  // before the next wave -- 5s only before the very first wave, 10s
  // between every wave after that, starting the moment the wave's last
  // enemy dies (not when it finishes spawning -- see updateWaveManager below).
  const INITIAL_GRACE_PERIOD = 5;        // seconds before wave 1 spawns
  const BETWEEN_WAVE_GRACE_PERIOD = 10;  // seconds after a wave is fully cleared, before the next spawns
  const ENEMY_SPAWN_STAGGER_DELAY = 0.4; // seconds between each enemy spawn within a wave
  const MAX_ENEMIES_PER_WAVE = 50;       // caps f(w) = 2w

  // Green enemy: a faster variant that starts showing up at
  // GREEN_ENEMY_START_WAVE, exactly one per wave from then on (the rest
  // of that wave's enemies are the normal kind). "250% faster" = speed
  // multiplied by 1 + 2.5 = 3.5x, same convention as e.g. "100% faster"
  // meaning double speed.
  const GREEN_ENEMY_START_WAVE = 5;
  const GREEN_ENEMY_SPEED_MULTIPLIER = 3.5;

  // Hitscan weapon: left-click fires an instant raycast down the crosshair.
  // Ammo is tracked as loaded (chamber + magazine, max 13) and reserve
  // (spare rounds). Reloading is always a full magazine swap: it tops the
  // magazine up with 12 rounds from reserve (or whatever's left, if less
  // than 12), on top of a round already chambered if one was loaded --
  // leftover rounds from the old magazine are discarded, not banked.
  const WEAPON_DAMAGE = 40;                       // damage dealt per hit
  const MAGAZINE_CAPACITY = 12;                   // rounds a reload draws from reserve into the magazine
  const MAX_LOADED_AMMO = MAGAZINE_CAPACITY + 1;  // magazine + 1 chambered round
  const DEFAULT_RESERVE_AMMO = 36;                // starting spare rounds -- not specified, picked as 3 magazines' worth
  const RELOAD_DURATION = 1.5;                    // seconds the reload locks firing before ammo updates

  // Ammo pickups: killing an enemy has a flat chance to drop one at the
  // enemy's death position. Floats above the ground and refills reserve
  // ammo when the player walks over it; despawns on its own if left
  // uncollected too long.
  const AMMO_DROP_CHANCE = 0.2;              // 20% chance per enemy kill
  const AMMO_PICKUP_AMOUNT = 12;             // reserve rounds granted on pickup
  const AMMO_PICKUP_LIFETIME = 60;           // seconds before an uncollected pickup despawns
  const AMMO_PICKUP_COLLECT_DISTANCE = 0.8;  // horizontal distance that counts as "walked over"
  const AMMO_PICKUP_HOVER_HEIGHT = 0.5;      // height above the ground the pickup floats at
  const AMMO_PICKUP_SIZE = 0.35;             // pickup cube's side length

  // Reload animation: the view-model gun tilts upward, then eases back
  // down to normal, over the course of RELOAD_DURATION. RISE_FRACTION is
  // the portion of the reload spent tilting up; the remainder is the
  // (slower, smoothed) return to normal.
  const RELOAD_TILT_ANGLE = 0.55;          // peak upward tilt, radians
  const RELOAD_TILT_RISE_FRACTION = 0.3;   // fraction of RELOAD_DURATION spent rising

  const HIT_MARKER_DURATION = 0.2; // seconds a hit marker stays on screen

  // Aim down sights (hold right click): the gun lerps toward screen-center
  // and the camera's FOV narrows, both easing in/out over ADS_TRANSITION_DURATION.
  // Mouse sensitivity intentionally does NOT change while aiming.
  const NORMAL_FOV = 75;               // matches the camera's base FOV below
  const ADS_FOV = 60;                  // 20% narrower than NORMAL_FOV -- the "zoom"
  const ADS_TRANSITION_DURATION = 0.2; // seconds to fully enter/leave ADS

  // Hip-fire spread: without ADS, each shot's raycast direction gets a
  // random offset within this cone (radians, half-angle) around the true
  // crosshair direction, so hip-fire isn't perfectly accurate. Fixed size --
  // no bloom that grows with movement or fire rate. Fully accurate (no
  // spread at all) while aiming down sights.
  const HIP_FIRE_SPREAD_ANGLE = 0.044; // ~2.5 degrees

  // Recoil: each shot kicks the gun's pitch up and punches it back toward
  // the camera, then both recover exponentially back to 0 (same
  // decay-toward-target style as CROUCH_TRANSITION_SPEED above). Kicks
  // stack if shots land faster than recovery, for a bit of climb on rapid fire.
  const RECOIL_KICK_PITCH = 0.09;      // radians added to gun pitch per shot
  const RECOIL_KICK_KICKBACK = 0.05;   // gun pushed back toward the camera per shot
  const RECOIL_RECOVERY_SPEED = 14;    // how fast recoil decays back to 0

  // Gun bob: while grounded and moving, the gun bobs vertically with a
  // sine wave whose phase advances with distance traveled -- so bobbing
  // speeds up automatically at higher speed (e.g. sprinting) without
  // needing a separate sprint flag. Amplitude scales with speed (relative
  // to WALK_SPEED) and both are smoothed toward their targets.
  const BOB_FREQUENCY = 1.6;              // radians of bob phase per unit speed per second
  const BOB_AMPLITUDE = 0.02;             // peak vertical offset at walk speed
  const BOB_MAX_AMPLITUDE_SCALE = 1.4;    // caps how much extra amplitude sprint/slide speed adds
  const BOB_AMPLITUDE_SMOOTHING = 8;      // how fast bob amplitude eases toward its target

  // ------------------------------------------------------------------
  // SCENE / RENDERER / CAMERA SETUP
  // ------------------------------------------------------------------
  const scene = new THREE.Scene();
  const SKY_COLOR = 0x87ceeb; // light blue -- shared so the background and fog can't drift apart
  scene.background = new THREE.Color(SKY_COLOR);
  scene.fog = new THREE.Fog(SKY_COLOR, 40, 110);

  const camera = new THREE.PerspectiveCamera(
    NORMAL_FOV,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, EYE_HEIGHT, 0);

  // The camera itself needs to be part of the scene graph for its
  // children (the view-model gun below) to be rendered -- objects
  // parented to a camera that isn't in the scene are never visited by
  // renderer.render's traversal, even though the camera still works fine
  // for viewing/raycasting either way.
  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // ------------------------------------------------------------------
  // VIEW-MODEL GUN: a placeholder built from two rectangular prisms (a
  // long "slide/barrel" block and a shorter "grip" block), parented to
  // the camera so it rides along with it and is always locked to the
  // player's view. Positioned bottom-right, like a typical FPS view model.
  //
  // All dimensions/positions are named constants (rather than inline
  // numbers) since this is the block we've tuned by feel the most --
  // GUN_MUZZLE_TIP_POSITION in particular is *derived* from
  // GUN_BODY_POSITION/GUN_BODY_SIZE below instead of a separately
  // hand-computed number, so resizing/repositioning the body can't
  // silently leave the muzzle flash spawning from the wrong spot.
  // ------------------------------------------------------------------
  const GUN_BODY_SIZE = { width: 0.09, height: 0.09, length: 0.42 };
  const GUN_BODY_POSITION = new THREE.Vector3(0, 0, -0.18); // extends forward, away from the camera

  const GUN_GRIP_SIZE = { width: 0.075, height: 0.22, depth: 0.09 };
  const GUN_GRIP_POSITION = new THREE.Vector3(0, -0.15, 0.05); // hangs below the rear of the body
  const GUN_GRIP_TILT = 0.25; // radians, angled back slightly like a pistol grip

  // The barrel's tip -- gunBody sits at GUN_BODY_POSITION with half-length
  // GUN_BODY_SIZE.length / 2, so its far (forward) end is that much further
  // along -Z. Purely a marker for the muzzle flash to read its current
  // world position off of each shot.
  const GUN_MUZZLE_TIP_POSITION = new THREE.Vector3(
    GUN_BODY_POSITION.x,
    GUN_BODY_POSITION.y,
    GUN_BODY_POSITION.z - GUN_BODY_SIZE.length / 2
  );

  const GUN_HIP_FIRE_POSITION = new THREE.Vector3(0.26, -0.24, -0.5);
  const GUN_HIP_FIRE_ROTATION_Y = -0.04;

  const gunGroup = new THREE.Group();

  const gunMaterial = new THREE.MeshStandardMaterial({
    color: 0x1c1c1e,
    roughness: 0.55,
    metalness: 0.4,
    emissive: 0x0a0a0a, // keeps the gun visibly shaded regardless of the
                        // world-space sun direction, since this rotates
                        // with the camera instead of staying put
  });

  const gunBodyGeometry = new THREE.BoxGeometry(
    GUN_BODY_SIZE.width,
    GUN_BODY_SIZE.height,
    GUN_BODY_SIZE.length
  );
  const gunBody = new THREE.Mesh(gunBodyGeometry, gunMaterial);
  gunBody.position.copy(GUN_BODY_POSITION);
  gunGroup.add(gunBody);

  const gunGripGeometry = new THREE.BoxGeometry(
    GUN_GRIP_SIZE.width,
    GUN_GRIP_SIZE.height,
    GUN_GRIP_SIZE.depth
  );
  const gunGrip = new THREE.Mesh(gunGripGeometry, gunMaterial);
  gunGrip.position.copy(GUN_GRIP_POSITION);
  gunGrip.rotation.x = GUN_GRIP_TILT;
  gunGroup.add(gunGrip);

  // An invisible marker at the barrel's tip, purely so the muzzle flash
  // can read off its current world position each shot -- it moves with
  // the gun through ADS/recoil/bob for free since it's a child of it.
  const muzzleTip = new THREE.Object3D();
  muzzleTip.position.copy(GUN_MUZZLE_TIP_POSITION);
  gunGroup.add(muzzleTip);

  gunGroup.position.copy(GUN_HIP_FIRE_POSITION);
  gunGroup.rotation.y = GUN_HIP_FIRE_ROTATION_Y;
  camera.add(gunGroup);

  // ADS lerps the gun from its hip-fire pose (above) to this centered
  // pose, lined up with the crosshair.
  const HIP_FIRE_GUN_POSITION = GUN_HIP_FIRE_POSITION.clone();
  const HIP_FIRE_GUN_ROTATION_Y = GUN_HIP_FIRE_ROTATION_Y;
  const ADS_GUN_POSITION = new THREE.Vector3(0, -0.08, -0.35);
  const ADS_GUN_ROTATION_Y = 0;

  // The gun's final transform each frame is layered from several
  // independent systems (ADS pose, reload tilt, recoil, bob) rather than
  // having each one write straight into gunGroup -- otherwise whichever
  // ran last would stomp the others. Each system below writes into its
  // own slice of this state; applyGunTransform() (called once per frame,
  // after all of them) combines it all into gunGroup's actual position/
  // rotation.
  const gunAdsPosition = HIP_FIRE_GUN_POSITION.clone();
  let gunAdsRotationY = HIP_FIRE_GUN_ROTATION_Y;
  let gunReloadTiltX = 0;
  let gunRecoilPitchX = 0;
  let gunRecoilKickZ = 0;
  let gunBobOffsetY = 0;

  function applyGunTransform() {
    gunGroup.position.set(
      gunAdsPosition.x,
      gunAdsPosition.y + gunBobOffsetY,
      gunAdsPosition.z + gunRecoilKickZ
    );
    gunGroup.rotation.set(gunReloadTiltX + gunRecoilPitchX, gunAdsRotationY, 0);
  }

  // ------------------------------------------------------------------
  // LIGHTING: sun-like directional light + soft ambient fill
  // ------------------------------------------------------------------
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfff4e0, 1.0);
  sunLight.position.set(30, 40, 20);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 1;
  sunLight.shadow.camera.far = 150;
  sunLight.shadow.camera.left = -60;
  sunLight.shadow.camera.right = 60;
  sunLight.shadow.camera.top = 60;
  sunLight.shadow.camera.bottom = -60;
  sunLight.shadow.bias = -0.0005;
  scene.add(sunLight);
  scene.add(sunLight.target);

  // ------------------------------------------------------------------
  // GROUND PLANE
  // ------------------------------------------------------------------
  const groundGeometry = new THREE.PlaneGeometry(PLATFORM_SIZE, PLATFORM_SIZE);
  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x4a7c3a, // neutral green
    roughness: 0.95,
    metalness: 0.0,
  });
  const ground = new THREE.Mesh(groundGeometry, groundMaterial);
  ground.rotation.x = -Math.PI / 2; // lay flat
  ground.receiveShadow = true;
  scene.add(ground);

  // A simple grid helper on top of the ground so motion is easy to see.
  const grid = new THREE.GridHelper(PLATFORM_SIZE, 40, 0x2f5a26, 0x2f5a26);
  grid.position.y = 0.01; // avoid z-fighting with the ground
  scene.add(grid);

  // ------------------------------------------------------------------
  // FLOOR PLAN: walls traced from the hand-drawn floor plan at
  // "5 nights at kise/svg.svg" (an 800x600 SVG canvas holding 5 straight
  // <line> walls plus two <rect> elements -- one rotated, one axis-
  // aligned -- as interior walls). SVG pixel coordinates (Y down) map
  // directly onto the game's X/Z ground plane (SVG x -> game x, SVG y ->
  // game z) and are recentered on the world origin. FLOOR_PLAN_SCALE is
  // chosen so that running the floor plan's longer bounding-box
  // dimension at WALK_SPEED -- i.e. crossing the map "if there were no
  // walls" -- takes about FLOOR_PLAN_RUN_SECONDS seconds. Sized 15%
  // smaller than the previous layout (was tuned to a flat 15s) per request.
  // ------------------------------------------------------------------
  const FLOOR_PLAN_RUN_SECONDS = 15 * 0.85; // 12.75s -- 15% smaller than the original 15s sizing
  const WALL_HEIGHT = 3.0;
  const WALL_THICKNESS = 0.25; // game units -- the 5 straight walls have no drawn thickness in the SVG
  const PLAYER_RADIUS = 0.35;  // player treated as a cylinder of this radius for wall collision

  // Straight walls, traced from svg.svg's <line> elements (id noted in
  // each comment), in original SVG pixel coordinates.
  const floorPlanLines = [
    { x1: 314.39998, y1: 80.8,      x2: 663.39999, y2: 79.8 },      // svg_5 -- shortened, leaving a gap to the left wall
    { x1: 662.39999, y1: 79.8,      x2: 658.39999, y2: 573.79999 }, // svg_6
    { x1: 294.39999, y1: 79.8,      x2: 293.39999, y2: 572.79999 }, // svg_7
    { x1: 294.39999, y1: 572.79999, x2: 597.39999, y2: 570.79999 }, // svg_9
    { x1: 596.39999, y1: 571.79999, x2: 596.39999, y2: 459.79999 }, // svg_10
  ];

  // The traced lines don't always meet exactly at shared corners (off by
  // a pixel or two in the source SVG) -- left as-is that leaves a seam in
  // both the rendered walls and, more importantly, a gap in the wall
  // colliders that the player or an enemy can clip through right at the
  // corner. Snap endpoints within FLOOR_PLAN_WELD_THRESHOLD of each other
  // to their shared average point so adjacent walls join cleanly. Uses
  // single-linkage (compares each endpoint only to later ones), which is
  // fine here since every real corner is exactly two endpoints meeting,
  // not a longer chain.
  const FLOOR_PLAN_WELD_THRESHOLD = 3; // SVG px

  function weldWallEndpoints(walls) {
    const endpoints = [];
    for (const wall of walls) {
      endpoints.push({ wall, xKey: "x1", yKey: "y1" });
      endpoints.push({ wall, xKey: "x2", yKey: "y2" });
    }
    const visited = new Array(endpoints.length).fill(false);
    for (let i = 0; i < endpoints.length; i++) {
      if (visited[i]) continue;
      const cluster = [i];
      visited[i] = true;
      for (let j = i + 1; j < endpoints.length; j++) {
        if (visited[j]) continue;
        const a = endpoints[i], b = endpoints[j];
        const dx = a.wall[a.xKey] - b.wall[b.xKey];
        const dy = a.wall[a.yKey] - b.wall[b.yKey];
        if (Math.hypot(dx, dy) <= FLOOR_PLAN_WELD_THRESHOLD) {
          cluster.push(j);
          visited[j] = true;
        }
      }
      if (cluster.length > 1) {
        let sumX = 0, sumY = 0;
        for (const idx of cluster) {
          sumX += endpoints[idx].wall[endpoints[idx].xKey];
          sumY += endpoints[idx].wall[endpoints[idx].yKey];
        }
        const avgX = sumX / cluster.length;
        const avgY = sumY / cluster.length;
        for (const idx of cluster) {
          endpoints[idx].wall[endpoints[idx].xKey] = avgX;
          endpoints[idx].wall[endpoints[idx].yKey] = avgY;
        }
      }
    }
  }

  weldWallEndpoints(floorPlanLines);

  // Reduces an SVG <rect> (with an optional "rotate(deg cx cy)" transform
  // about its own center, matching how the source file rotates svg_11)
  // to a centerline wall segment along its longer side; the shorter side
  // becomes wall thickness. Used for both svg_11 (rotated) and svg_1
  // (axis-aligned, rotationDeg omitted).
  function rectToWallSvg(x, y, width, height, rotationDeg) {
    const cx = x + width / 2;
    const cy = y + height / 2;
    const angleRad = ((rotationDeg || 0) * Math.PI) / 180;
    const longIsWidth = width >= height;
    const halfLength = (longIsWidth ? width : height) / 2;
    const localDx = longIsWidth ? halfLength : 0;
    const localDy = longIsWidth ? 0 : halfLength;
    const rotDx = localDx * Math.cos(angleRad) - localDy * Math.sin(angleRad);
    const rotDy = localDx * Math.sin(angleRad) + localDy * Math.cos(angleRad);
    return {
      x1: cx - rotDx, y1: cy - rotDy,
      x2: cx + rotDx, y2: cy + rotDy,
      thicknessSvg: longIsWidth ? height : width,
    };
  }

  // svg_11 -- diagonal interior wall.
  const diagonalWallSvg = rectToWallSvg(432.84588, 284.14676, 116.78891, 21.83853, -33.774);
  // svg_1 -- axis-aligned interior wall/pillar.
  const pillarWallSvg = rectToWallSvg(324.99999, 221.39999, 12, 101);

  const floorPlanRects = [diagonalWallSvg, pillarWallSvg];

  const allWallPointsSvg = floorPlanLines
    .flatMap((w) => [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }])
    .concat(floorPlanRects.flatMap((w) => [{ x: w.x1, y: w.y1 }, { x: w.x2, y: w.y2 }]));

  const floorPlanMinX = Math.min(...allWallPointsSvg.map((p) => p.x));
  const floorPlanMaxX = Math.max(...allWallPointsSvg.map((p) => p.x));
  const floorPlanMinY = Math.min(...allWallPointsSvg.map((p) => p.y));
  const floorPlanMaxY = Math.max(...allWallPointsSvg.map((p) => p.y));
  const floorPlanCenterX = (floorPlanMinX + floorPlanMaxX) / 2;
  const floorPlanCenterY = (floorPlanMinY + floorPlanMaxY) / 2;

  // Uses a fixed reference speed (WALK_SPEED's original value, before any
  // later balance tuning) rather than the live WALK_SPEED constant, so
  // changing player speed for balance reasons never silently resizes the
  // map -- map size and player speed are tuned independently.
  const FLOOR_PLAN_REFERENCE_SPEED = 6.0;
  const FLOOR_PLAN_SCALE =
    (FLOOR_PLAN_REFERENCE_SPEED * FLOOR_PLAN_RUN_SECONDS) /
    Math.max(floorPlanMaxX - floorPlanMinX, floorPlanMaxY - floorPlanMinY);

  function floorPlanToGame(svgX, svgY) {
    return {
      x: (svgX - floorPlanCenterX) * FLOOR_PLAN_SCALE,
      z: (svgY - floorPlanCenterY) * FLOOR_PLAN_SCALE,
    };
  }

  const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x9a8f80, roughness: 0.9 });

  // Collision segments consumed by resolveWallCollisions() below --
  // game-space endpoints plus half-thickness (player radius is added at
  // collision time).
  const wallColliders = [];

  function buildWall(svgWall, thicknessGame) {
    const p1 = floorPlanToGame(svgWall.x1, svgWall.y1);
    const p2 = floorPlanToGame(svgWall.x2, svgWall.y2);
    const dx = p2.x - p1.x;
    const dz = p2.z - p1.z;
    const length = Math.hypot(dx, dz);

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(length, WALL_HEIGHT, thicknessGame),
      wallMaterial
    );
    mesh.position.set((p1.x + p2.x) / 2, WALL_HEIGHT / 2, (p1.z + p2.z) / 2);
    // Aligns the box's local +X (its length axis) with the (dx, dz)
    // direction under THREE's Y-axis rotation convention.
    mesh.rotation.y = Math.atan2(-dz, dx);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    wallColliders.push({ x1: p1.x, z1: p1.z, x2: p2.x, z2: p2.z, halfThickness: thicknessGame / 2 });
  }

  for (const line of floorPlanLines) buildWall(line, WALL_THICKNESS);
  for (const rectWall of floorPlanRects) buildWall(rectWall, rectWall.thicknessSvg * FLOOR_PLAN_SCALE);

  // Pushes (x, z) out of any wall collider it overlaps, given a
  // collision radius (the player's own, or an enemy's -- see
  // moveWithWallCollision below, the only caller). Several passes per
  // call so corners (where two walls disagree on push-out direction)
  // settle instead of oscillating.
  function resolveWallCollisions(position, radius) {
    for (let pass = 0; pass < 4; pass++) {
      for (const wall of wallColliders) {
        const segX = wall.x2 - wall.x1;
        const segZ = wall.z2 - wall.z1;
        const segLengthSq = segX * segX + segZ * segZ;
        let t = segLengthSq > 0
          ? ((position.x - wall.x1) * segX + (position.z - wall.z1) * segZ) / segLengthSq
          : 0;
        t = Math.max(0, Math.min(1, t));

        const closestX = wall.x1 + segX * t;
        const closestZ = wall.z1 + segZ * t;
        const dx = position.x - closestX;
        const dz = position.z - closestZ;
        const distance = Math.hypot(dx, dz);
        const minDistance = wall.halfThickness + radius;

        if (distance < minDistance) {
          const nx = distance > 0.0001 ? dx / distance : 1;
          const nz = distance > 0.0001 ? dz / distance : 0;
          position.x += nx * (minDistance - distance);
          position.z += nz * (minDistance - distance);
        }
      }
    }
  }

  // Moving a whole frame's displacement in one jump can tunnel straight
  // through a thin wall when the displacement is large relative to wall
  // thickness (e.g. a fast slide, or a big delta after a stalled/dropped
  // frame) -- resolveWallCollisions only ever sees the post-move
  // position, never the path taken to get there. Splitting the move into
  // WALL_COLLISION_MAX_STEP-sized sub-steps and resolving collision after
  // each one approximates continuous collision without full swept-shape
  // math, and this is the only place `position` should be moved and
  // collided against the floor plan -- used for both the player (see
  // updateMovement) and every enemy (see updateEnemies).
  const WALL_COLLISION_MAX_STEP = 0.08; // game units

  function moveWithWallCollision(position, deltaX, deltaZ, radius) {
    const distance = Math.hypot(deltaX, deltaZ);
    const steps = Math.max(1, Math.ceil(distance / WALL_COLLISION_MAX_STEP));
    const stepX = deltaX / steps;
    const stepZ = deltaZ / steps;
    for (let i = 0; i < steps; i++) {
      position.x += stepX;
      position.z += stepZ;
      resolveWallCollisions(position, radius);
    }
  }

  // Spawn the player in the top-left interior pocket of the floor plan,
  // clear of every wall.
  const playerSpawnPoint = floorPlanToGame(340, 160);
  camera.position.x = playerSpawnPoint.x;
  camera.position.z = playerSpawnPoint.z;

  // ------------------------------------------------------------------
  // ENEMY: a person-sized box that constantly walks toward the player.
  // Geometry/materials are shared across every spawned enemy (created
  // once here); each enemy is its own Mesh instance plus a small state
  // object in the `enemies` array -- see spawnEnemy() and updateEnemies()
  // further below, after the wave spawner section.
  // ------------------------------------------------------------------
  const enemyGeometry = new THREE.BoxGeometry(
    ENEMY_SIZE.width,
    ENEMY_SIZE.height,
    ENEMY_SIZE.depth
  );
  const enemyBodyMaterial = new THREE.MeshStandardMaterial({
    color: 0x8b0000,
    roughness: 0.7,
  });
  // Green variant for the fast enemy introduced at GREEN_ENEMY_START_WAVE
  // (see spawnEnemy below) -- same geometry/face, just a different body
  // color and speed.
  const greenEnemyBodyMaterial = new THREE.MeshStandardMaterial({
    color: 0x228b22,
    roughness: 0.7,
  });

  // Placeholder face: rather than texturing a BoxGeometry face slot
  // (unreliable to get facing the right way once the box is rotated),
  // this is a separate flat plane glued to the front of the box, sized
  // to the source image's aspect ratio and positioned where a face
  // would sit on a person, instead of stretching across the whole body.
  // It is parented to the enemy mesh so it turns (and scales) together
  // with it. Geometry/material/texture are shared across every enemy,
  // just like the body above -- only the plane Mesh itself is per-instance.
  //
  // Embedded as a base64 data URI (rather than loaded from a relative
  // path) so the texture survives being opened directly via file://
  // Chrome treats each file:// resource as its own opaque origin and
  // refuses to upload a cross-origin-looking image into a WebGL
  // texture, which silently left it blank. A data URI has no such
  // origin problem and keeps this a single self-contained HTML file.

  // ------------------------------------------------------------------
  // ENEMY SPAWNERS: invisible markers that wave spawns draw enemies from.
  // Plain THREE.Object3D (no geometry), so it never renders and can never
  // be hit by the weapon raycast. Kept as a list rather than a single
  // reference since more will be placed manually later -- nothing below
  // assumes there's exactly one.
  // ------------------------------------------------------------------
  const enemySpawners = [];

  function createEnemySpawner(position) {
    const spawner = new THREE.Object3D();
    spawner.position.copy(position);
    scene.add(spawner);
    enemySpawners.push(spawner);
    return spawner;
  }

  // Three spawn points outside the main enclosure (rather than inside it
  // with the player), each clear of every wall/pillar collider by a wide
  // margin; spawnEnemyFromRandomSpawner() picks one at random each time
  // an enemy spawns. The north and south points sit just past the floor
  // plan's two actual gaps (the new opening in the top wall, and the
  // open south edge of the bottom-right pocket) so enemies have a real
  // path in; the east point relies on the wall-sliding behavior of
  // moveWithWallCollision to find its way to one of those gaps.
  const ENEMY_SPAWN_POINTS_SVG = [
    { x: 303, y: 45 },  // north, outside the top-wall gap
    { x: 627, y: 615 }, // south, outside the bottom-right pocket's open edge
    { x: 720, y: 320 }, // east, outside the right wall
  ];
  for (const point of ENEMY_SPAWN_POINTS_SVG) {
    const spawnPos = floorPlanToGame(point.x, point.y);
    createEnemySpawner(new THREE.Vector3(spawnPos.x, 0, spawnPos.z));
  }

  // ------------------------------------------------------------------
  // ENEMY SPAWNING: creates one enemy mesh + its state object, with
  // independently randomized speed/size (see randomStatVariance below),
  // and adds it to the `enemies` array that updateEnemies() drives every
  // frame. Picks a random active spawner each time, so this keeps working
  // unchanged whether there's 1 spawner or many.
  // ------------------------------------------------------------------
  const enemies = [];

  // +/-1%-5%, independently per call -- used for both speed and size so
  // each enemy's stats vary independently of one another. Deliberately
  // NOT a function of wave number: this is per-enemy flavor, not scaling.
  function randomStatVariance() {
    const range = ENEMY_STAT_VARIANCE_MAX - ENEMY_STAT_VARIANCE_MIN;
    const magnitude = ENEMY_STAT_VARIANCE_MIN + Math.random() * range;
    const sign = Math.random() < 0.5 ? -1 : 1;
    return sign * magnitude;
  }

  function spawnEnemy(position, isGreen) {
    const mesh = new THREE.Mesh(enemyGeometry, isGreen ? greenEnemyBodyMaterial : enemyBodyMaterial);
    mesh.castShadow = true;
    mesh.receiveShadow = true;

    const facePlane = new THREE.Mesh(enemyFaceGeometry, enemyFaceMaterial);
    facePlane.position.copy(enemyFacePosition);
    mesh.add(facePlane);

    const baseSpeed = ENEMY_SPEED * (1 + randomStatVariance());
    const speed = isGreen ? baseSpeed * GREEN_ENEMY_SPEED_MULTIPLIER : baseSpeed;
    const sizeScale = 1 + randomStatVariance();

    mesh.scale.setScalar(sizeScale);
    mesh.position.set(position.x, (ENEMY_SIZE.height / 2) * sizeScale, position.z);
    scene.add(mesh);

    const enemyState = {
      mesh,
      yaw: 0,
      health: ENEMY_MAX_HEALTH,
      speed,
      sizeScale,
      hitCooldown: 0,
      isGreen: !!isGreen,
    };
    // Tagged on both the body and the face plane so a raycast hit on
    // either one resolves straight back to this enemy's state, without
    // walking up the parent chain.
    mesh.userData.enemyRef = enemyState;
    facePlane.userData.enemyRef = enemyState;

    enemies.push(enemyState);
    return enemyState;
  }

  function spawnEnemyFromRandomSpawner(isGreen) {
    const spawner = enemySpawners[Math.floor(Math.random() * enemySpawners.length)];
    spawnEnemy(spawner.position, isGreen);
  }

  function removeEnemy(enemyState) {
    scene.remove(enemyState.mesh);
    const index = enemies.indexOf(enemyState);
    if (index !== -1) enemies.splice(index, 1);
  }

  // ------------------------------------------------------------------
  // GAME STATE: health, death, jump/gravity
  // ------------------------------------------------------------------
  let health = MAX_HEALTH;
  let isDead = false;
  let verticalVelocity = 0;
  let isGrounded = true;
  let isSliding = false;
  let slideElapsed = 0;
  let slideCooldown = 0;

  // Current standing/crouching eye height, smoothly lerped toward
  // EYE_HEIGHT or CROUCH_EYE_HEIGHT each frame. Jump/gravity apply as a
  // separate offset on top of this rather than fighting over the same
  // value, so jumping while crouched (or crouching mid-air) behaves.
  let currentEyeHeight = EYE_HEIGHT;
  let jumpOffset = 0;

  // Ammo: loadedAmmo is chamber + magazine together (max MAX_LOADED_AMMO),
  // reserveAmmo is spare rounds not yet loaded. Starts full.
  let loadedAmmo = MAX_LOADED_AMMO;
  let reserveAmmo = DEFAULT_RESERVE_AMMO;
  let isReloading = false;
  let reloadElapsed = 0;

  // Aim down sights: isAimButtonHeld is the raw held state (right click).
  // isAiming is the *effective* state used everywhere else (gun pose, FOV,
  // spread) -- it's forced false while isSprinting, so sprinting always
  // cancels ADS; letting go of sprint (while the button is still held)
  // lets it resume on its own. aimProgress eases from 0 (hip-fire) to 1
  // (fully aimed) over ADS_TRANSITION_DURATION and drives the gun pose/FOV.
  let isAimButtonHeld = false;
  let isAiming = false;
  let aimProgress = 0;

  // Set by updateMovement each frame; read here so ADS can react to
  // sprinting without updateMovement needing to know anything about aim.
  let isSprinting = false;

  const healthTextEl = document.getElementById("health-text");
  const healthBarFillEl = document.getElementById("health-bar-fill");
  const deathScreenEl = document.getElementById("death-screen");
  const ammoLoadedEl = document.getElementById("ammo-loaded");
  const ammoReserveEl = document.getElementById("ammo-reserve");

  function updateAmmoUI() {
    ammoLoadedEl.textContent = loadedAmmo;
    ammoReserveEl.textContent = reserveAmmo;
  }

  function damageEnemy(enemyState, amount, hitPoint) {
    enemyState.health -= amount;
    if (enemyState.health <= 0) {
      spawnParticleBurst(enemyState.mesh.position, DEATH_PARTICLE_OPTIONS);
      if (Math.random() < AMMO_DROP_CHANCE) {
        spawnAmmoPickup(enemyState.mesh.position);
      }
      removeEnemy(enemyState);
    } else if (hitPoint) {
      spawnParticleBurst(hitPoint, BLOOD_SPLASH_PARTICLE_OPTIONS);
    }
  }

  // ------------------------------------------------------------------
  // PARTICLE BURSTS: shared by death particles, hit blood splashes, and
  // the muzzle flash below -- all are the same shape (a one-shot cluster
  // of THREE.Points that fly outward, fall under gravity, and fade out
  // via opacity), just with different counts/colors/speeds/lifetimes.
  // Updated by hand each frame and disposed once their lifetime runs out.
  // ------------------------------------------------------------------
  const activeParticleBursts = [];

  const DEATH_PARTICLE_OPTIONS = {
    count: 24,
    color: 0xff2222,
    size: 0.12,
    lifetime: 1.0,
    speedMin: 2,
    speedMax: 5,
    upwardBias: 1.5,
    gravityScale: 1,
  };

  const BLOOD_SPLASH_PARTICLE_OPTIONS = {
    count: 8,
    color: 0xaa1111,
    size: 0.06,
    lifetime: 0.5,
    speedMin: 0.5,
    speedMax: 1.8,
    upwardBias: 0.4,
    gravityScale: 1,
  };

  const MUZZLE_FLASH_PARTICLE_OPTIONS = {
    count: 6,
    color: 0xffcc55,
    size: 0.05,
    lifetime: 0.05,
    speedMin: 0.3,
    speedMax: 1.0,
    upwardBias: 0,
    gravityScale: 0, // gone too fast for gravity to matter
  };
  const muzzleWorldPosition = new THREE.Vector3();

  function spawnMuzzleFlash() {
    muzzleTip.getWorldPosition(muzzleWorldPosition);
    spawnParticleBurst(muzzleWorldPosition, MUZZLE_FLASH_PARTICLE_OPTIONS);
  }

  function spawnParticleBurst(position, options) {
    const { count, color, size, lifetime, speedMin, speedMax, upwardBias, gravityScale } = options;

    const positions = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      positions[i * 3] = position.x;
      positions[i * 3 + 1] = position.y;
      positions[i * 3 + 2] = position.z;

      // Random outward direction, biased upward so the burst reads as an
      // "explosion" rather than particles just falling out sideways.
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.random() * Math.PI;
      const speed = speedMin + Math.random() * (speedMax - speedMin);
      velocities[i * 3] = Math.sin(phi) * Math.cos(theta) * speed;
      velocities[i * 3 + 1] = Math.cos(phi) * speed * 0.6 + upwardBias;
      velocities[i * 3 + 2] = Math.sin(phi) * Math.sin(theta) * speed;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color,
      size,
      transparent: true,
      opacity: 1,
      depthWrite: false,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    activeParticleBursts.push({ points, velocities, elapsed: 0, lifetime, gravityScale });
  }

  function updateParticleBursts(deltaSeconds) {
    for (let i = activeParticleBursts.length - 1; i >= 0; i--) {
      const burst = activeParticleBursts[i];
      burst.elapsed += deltaSeconds;

      const positions = burst.points.geometry.attributes.position.array;
      const count = positions.length / 3;
      for (let p = 0; p < count; p++) {
        positions[p * 3] += burst.velocities[p * 3] * deltaSeconds;
        positions[p * 3 + 1] += burst.velocities[p * 3 + 1] * deltaSeconds;
        positions[p * 3 + 2] += burst.velocities[p * 3 + 2] * deltaSeconds;
        burst.velocities[p * 3 + 1] += GRAVITY * burst.gravityScale * deltaSeconds;
      }
      burst.points.geometry.attributes.position.needsUpdate = true;
      burst.points.material.opacity = Math.max(0, 1 - burst.elapsed / burst.lifetime);

      if (burst.elapsed >= burst.lifetime) {
        scene.remove(burst.points);
        burst.points.geometry.dispose();
        burst.points.material.dispose();
        activeParticleBursts.splice(i, 1);
      }
    }
  }

  // ------------------------------------------------------------------
  // AMMO PICKUPS: small floating cubes textured with the ammo box image,
  // dropped by damageEnemy() on a AMMO_DROP_CHANCE roll. Walking within
  // AMMO_PICKUP_COLLECT_DISTANCE of one collects it (refills reserve ammo
  // and removes it); otherwise it despawns on its own after
  // AMMO_PICKUP_LIFETIME seconds.
  // ------------------------------------------------------------------
  const ammoPickupGeometry = new THREE.BoxGeometry(
    AMMO_PICKUP_SIZE,
    AMMO_PICKUP_SIZE,
    AMMO_PICKUP_SIZE
  );
  const ammoPickupMaterial = new THREE.MeshStandardMaterial({ map: ammoBoxTexture });
  const activeAmmoPickups = [];

  function spawnAmmoPickup(position) {
    const mesh = new THREE.Mesh(ammoPickupGeometry, ammoPickupMaterial);
    mesh.position.set(position.x, AMMO_PICKUP_HOVER_HEIGHT, position.z);
    mesh.castShadow = true;
    scene.add(mesh);
    activeAmmoPickups.push({ mesh, elapsed: 0 });
  }

  function updateAmmoPickups(deltaSeconds) {
    for (let i = activeAmmoPickups.length - 1; i >= 0; i--) {
      const pickup = activeAmmoPickups[i];
      pickup.elapsed += deltaSeconds;

      const dx = camera.position.x - pickup.mesh.position.x;
      const dz = camera.position.z - pickup.mesh.position.z;
      const collected =
        document.pointerLockElement === canvas &&
        Math.hypot(dx, dz) < AMMO_PICKUP_COLLECT_DISTANCE;

      if (collected) {
        reserveAmmo += AMMO_PICKUP_AMOUNT;
        updateAmmoUI();
      }

      if (collected || pickup.elapsed >= AMMO_PICKUP_LIFETIME) {
        scene.remove(pickup.mesh);
        activeAmmoPickups.splice(i, 1);
      }
    }
  }

  function updateHealthUI() {
    const pct = Math.max(0, Math.min(100, (health / MAX_HEALTH) * 100));
    healthBarFillEl.style.width = pct + "%";
    healthTextEl.textContent = Math.ceil(Math.max(0, health));

    // Green (51-100) -> yellow (21-50) -> red (1-20) as health drops.
    if (pct > 50) {
      healthBarFillEl.style.backgroundColor = "#3ddc3d";
    } else if (pct > 20) {
      healthBarFillEl.style.backgroundColor = "#e0c33d";
    } else {
      healthBarFillEl.style.backgroundColor = "#e03d3d";
    }
  }

  function takeDamage(amount) {
    if (isDead) return;
    health -= amount;
    if (health <= 0) {
      health = 0;
      updateHealthUI();
      triggerDeath();
      return;
    }
    updateHealthUI();
  }

  function triggerDeath() {
    isDead = true;
    deathScreenEl.classList.add("visible");
    document.exitPointerLock();
  }

  // Restores every piece of run state back to exactly what it is at
  // script startup: player health/ammo/position/pose, all gun sub-systems
  // (reload/ADS/recoil/bob), all live enemies cleared, and the wave
  // manager reset to the pre-wave-1 grace period -- i.e. "as if the game
  // just launched fresh". Does NOT touch `keys` (the player's physically
  // held keys are still valid) or in-flight particle bursts (harmless to
  // just let them finish).
  function resetGame() {
    health = MAX_HEALTH;
    isDead = false;
    deathScreenEl.classList.remove("visible");

    loadedAmmo = MAX_LOADED_AMMO;
    reserveAmmo = DEFAULT_RESERVE_AMMO;
    isReloading = false;
    reloadElapsed = 0;
    gunReloadTiltX = 0;

    isAimButtonHeld = false;
    isAiming = false;
    isSprinting = false;
    aimProgress = 0;
    gunAdsPosition.copy(HIP_FIRE_GUN_POSITION);
    gunAdsRotationY = HIP_FIRE_GUN_ROTATION_Y;
    camera.fov = NORMAL_FOV;
    camera.updateProjectionMatrix();

    gunRecoilPitchX = 0;
    gunRecoilKickZ = 0;
    gunBobPhase = 0;
    gunBobAmplitude = 0;
    gunBobOffsetY = 0;
    applyGunTransform(); // snap the gun back immediately instead of drifting there over the next frame

    hitMarkerTimer = 0;
    hitMarkerEl.classList.remove("visible");

    isSliding = false;
    slideElapsed = 0;
    slideCooldown = 0;
    verticalVelocity = 0;
    isGrounded = true;
    jumpOffset = 0;
    currentEyeHeight = EYE_HEIGHT;
    velocity.set(0, 0, 0);

    yaw = 0;
    pitch = 0;
    camera.position.set(0, EYE_HEIGHT, 0);
    camera.rotation.order = "YXZ";
    camera.rotation.y = 0;
    camera.rotation.x = 0;

    for (const enemyState of enemies) {
      scene.remove(enemyState.mesh);
    }
    enemies.length = 0;

    for (const pickup of activeAmmoPickups) {
      scene.remove(pickup.mesh);
    }
    activeAmmoPickups.length = 0;

    waveNumber = 0;
    waveState = "grace";
    waveTimer = INITIAL_GRACE_PERIOD;
    enemiesRemainingToSpawn = 0;
    waveEnemiesSpawnedSoFar = 0;
    updateWaveHudUI();

    updateHealthUI();
    updateAmmoUI();
  }

  // ------------------------------------------------------------------
  // POINTER LOCK + MOUSE LOOK
  // ------------------------------------------------------------------
  const overlay = document.getElementById("overlay");
  const canvas = renderer.domElement;

  let yaw = 0;   // rotation around Y axis (left/right)
  let pitch = 0; // rotation around X axis (up/down), clamped

  function onPointerLockChange() {
    if (document.pointerLockElement === canvas) {
      overlay.classList.add("hidden");
    } else {
      // Losing pointer lock (alt-tab, death, Esc) never leaves the player
      // stuck holding aim or sprint -- there's no mouseup/keyup to catch
      // it otherwise, and updateMovement's own isSprinting assignment is
      // skipped whenever pointer lock isn't held.
      isAimButtonHeld = false;
      isAiming = false;
      isSprinting = false;
      if (!isDead) {
        overlay.classList.remove("hidden");
      }
    }
  }

  function onMouseMove(event) {
    if (document.pointerLockElement !== canvas) return;

    const movementX = event.movementX || 0;
    const movementY = event.movementY || 0;

    // Dampen mouse look while sliding (reinforces the reduced steering
    // control), back to normal the instant the slide ends.
    const sensitivity = isSliding
      ? MOUSE_SENSITIVITY * SLIDE_MOUSE_SENSITIVITY_MULTIPLIER
      : MOUSE_SENSITIVITY;

    yaw -= movementX * sensitivity;
    pitch -= movementY * sensitivity;

    // Clamp pitch so the player can't flip past straight up/down.
    pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));

    // Apply as a YXZ Euler so yaw and pitch behave like a standard FPS camera.
    camera.rotation.order = "YXZ";
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  overlay.addEventListener("click", function () {
    canvas.requestPointerLock();
  });

  const restartButtonEl = document.getElementById("restart-button");
  restartButtonEl.addEventListener("click", function (event) {
    // Stop the click reaching the death screen / canvas underneath, and
    // re-request pointer lock right from this same user gesture so the
    // player drops straight back into play instead of needing to click
    // the "Click to play" overlay again afterward.
    event.stopPropagation();
    resetGame();
    canvas.requestPointerLock();
  });

  document.addEventListener("pointerlockchange", onPointerLockChange, false);
  document.addEventListener("mousemove", onMouseMove, false);

  // ------------------------------------------------------------------
  // WASD MOVEMENT
  // ------------------------------------------------------------------
  const keys = {
    KeyW: false,
    KeyA: false,
    KeyS: false,
    KeyD: false,
    ShiftLeft: false,
    ShiftRight: false,
    ControlLeft: false,
    ControlRight: false,
  };

  document.addEventListener("keydown", function (event) {
    if (Object.prototype.hasOwnProperty.call(keys, event.code)) {
      keys[event.code] = true;
    }

    if (event.code === "Space") {
      event.preventDefault(); // stop spacebar from scrolling the page
    }

    // While actively playing, holding Ctrl (crouch) plus another key
    // shouldn't fire browser shortcuts (Ctrl+S save, Ctrl+F find, Ctrl+A
    // select-all, etc.). Note: a few combos like Ctrl+W/Ctrl+T/Ctrl+N are
    // reserved by the browser itself and can't be overridden by any page.
    if (document.pointerLockElement === canvas && event.ctrlKey) {
      event.preventDefault();
    }

    // Jump: only trigger on the initial keydown (not held-repeat) and only
    // while playing and grounded.
    if (
      event.code === "Space" &&
      !event.repeat &&
      document.pointerLockElement === canvas &&
      !isDead &&
      isGrounded
    ) {
      verticalVelocity = JUMP_SPEED;
      isGrounded = false;

      // Jumping cancels an active slide.
      if (isSliding) {
        endSlide();
      }
    }

    // Slide: tap Ctrl (only trigger on the initial keydown, not held-repeat)
    // to start one. Tapping it again cancels an active slide early -- since
    // this only fires on a genuine fresh keydown (event.repeat is false),
    // the key has to have been released and pressed again to reach this
    // branch, so holding Ctrl down through the whole slide never cancels it.
    if (
      (event.code === "ControlLeft" || event.code === "ControlRight") &&
      !event.repeat &&
      document.pointerLockElement === canvas &&
      !isDead
    ) {
      if (isSliding) {
        endSlide();
      } else {
        tryStartSlide();
      }
    }

    // Reload: only trigger on the initial keydown (not held-repeat).
    if (
      event.code === "KeyR" &&
      !event.repeat &&
      document.pointerLockElement === canvas &&
      !isDead
    ) {
      tryReload();
    }
  });

  document.addEventListener("keyup", function (event) {
    if (Object.prototype.hasOwnProperty.call(keys, event.code)) {
      keys[event.code] = false;
    }
  });

  // Left-click fires. mousedown (unlike keydown) doesn't auto-repeat while
  // held, so this is naturally semi-automatic -- one shot per click.
  document.addEventListener("mousedown", function (event) {
    if (event.button !== 0) return; // left button only
    if (document.pointerLockElement !== canvas || isDead) return;
    fireWeapon();
  });

  // Right-click holds aim down sights. Suppress the browser's context menu
  // so a right-click during play doesn't pop it up instead.
  document.addEventListener("contextmenu", function (event) {
    if (document.pointerLockElement === canvas) {
      event.preventDefault();
    }
  });

  document.addEventListener("mousedown", function (event) {
    if (event.button !== 2) return; // right button only
    if (document.pointerLockElement !== canvas || isDead) return;
    isAimButtonHeld = true;
  });

  document.addEventListener("mouseup", function (event) {
    if (event.button !== 2) return;
    isAimButtonHeld = false;
  });

  // Reusable vectors/helpers to avoid allocating garbage every frame.
  const forwardVector = new THREE.Vector3();
  const rightVector = new THREE.Vector3();
  const wishDirection = new THREE.Vector3();
  const worldUp = new THREE.Vector3(0, 1, 0);
  const slideDirectionScratch = new THREE.Vector3();

  // Hitscan weapon: raycasts from the camera through the (screen-centered)
  // crosshair, since that's where the camera + crosshair already point.
  const raycaster = new THREE.Raycaster();
  const screenCenter = new THREE.Vector2(0, 0);
  const cameraRightAxis = new THREE.Vector3();
  const cameraUpAxis = new THREE.Vector3();

  function fireWeapon() {
    if (isReloading) return;

    if (loadedAmmo <= 0) {
      // Dry fire: no damage, no ammo to consume. No audio system exists
      // in this project yet, so there's no sound cue to play here.
      return;
    }

    loadedAmmo -= 1;
    updateAmmoUI();
    applyRecoil();
    spawnMuzzleFlash();

    raycaster.setFromCamera(screenCenter, camera);
    if (!isAiming) {
      applyHipFireSpread(raycaster);
    }

    const hits = raycaster.intersectObjects(enemies.map((e) => e.mesh), true);
    if (hits.length > 0) {
      const hitEnemy = hits[0].object.userData.enemyRef;
      damageEnemy(hitEnemy, WEAPON_DAMAGE, hits[0].point);
      showHitMarker();
    }
  }

  // Perturbs the raycaster's direction by a random offset within a fixed
  // cone (HIP_FIRE_SPREAD_ANGLE) around the true aim direction, so
  // hip-fire shots can miss even when the crosshair looks on target.
  // sqrt(random) for the radius keeps the sample uniform by area rather
  // than clustered toward the center. Not used at all while aiming down
  // sights, which is fully accurate.
  function applyHipFireSpread(raycaster) {
    cameraRightAxis.set(1, 0, 0).applyQuaternion(camera.quaternion);
    cameraUpAxis.set(0, 1, 0).applyQuaternion(camera.quaternion);

    const spreadRadius = HIP_FIRE_SPREAD_ANGLE * Math.sqrt(Math.random());
    const spreadTheta = Math.random() * Math.PI * 2;

    raycaster.ray.direction
      .addScaledVector(cameraRightAxis, Math.cos(spreadTheta) * spreadRadius)
      .addScaledVector(cameraUpAxis, Math.sin(spreadTheta) * spreadRadius)
      .normalize();
  }

  // ------------------------------------------------------------------
  // HIT MARKER: a brief on-screen "X" shown for HIT_MARKER_DURATION
  // whenever a shot registers on the enemy.
  // ------------------------------------------------------------------
  const hitMarkerEl = document.getElementById("hit-marker");
  let hitMarkerTimer = 0;

  function showHitMarker() {
    hitMarkerTimer = HIT_MARKER_DURATION;
    hitMarkerEl.classList.add("visible");
  }

  function updateHitMarker(deltaSeconds) {
    if (hitMarkerTimer <= 0) return;
    hitMarkerTimer -= deltaSeconds;
    if (hitMarkerTimer <= 0) {
      hitMarkerTimer = 0;
      hitMarkerEl.classList.remove("visible");
    }
  }

  function tryReload() {
    if (isReloading || reserveAmmo <= 0 || loadedAmmo >= MAX_LOADED_AMMO) return;
    isReloading = true;
    reloadElapsed = 0;
  }

  // Eases the view-model gun's reload tilt: a quick rise to
  // RELOAD_TILT_ANGLE over the first RELOAD_TILT_RISE_FRACTION of the
  // reload, then a smoothed ease back down to 0 over the remainder.
  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }
  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
  function getReloadTilt(progress) {
    if (progress < RELOAD_TILT_RISE_FRACTION) {
      return RELOAD_TILT_ANGLE * easeOutCubic(progress / RELOAD_TILT_RISE_FRACTION);
    }
    const fallProgress =
      (progress - RELOAD_TILT_RISE_FRACTION) / (1 - RELOAD_TILT_RISE_FRACTION);
    return RELOAD_TILT_ANGLE * (1 - easeInOutCubic(fallProgress));
  }

  function updateReload(deltaSeconds) {
    if (!isReloading) return;

    reloadElapsed += deltaSeconds;
    gunReloadTiltX = getReloadTilt(Math.min(reloadElapsed / RELOAD_DURATION, 1));
    if (reloadElapsed < RELOAD_DURATION) return;

    isReloading = false;
    gunReloadTiltX = 0;

    // A full magazine swap: always draws a full MAGAZINE_CAPACITY rounds
    // from reserve (or whatever's left, if less), on top of a round already
    // chambered (if loadedAmmo was at least 1 going into the reload) -- the
    // old magazine's leftover rounds are discarded, not banked back.
    const hadChamberedRound = loadedAmmo >= 1;
    const roundsToLoad = Math.min(MAGAZINE_CAPACITY, reserveAmmo);
    reserveAmmo -= roundsToLoad;
    loadedAmmo = roundsToLoad + (hadChamberedRound ? 1 : 0);

    updateAmmoUI();
  }

  // Aim down sights: aimProgress ramps linearly toward 0 or 1 over exactly
  // ADS_TRANSITION_DURATION seconds (symmetric both ways), then gets eased
  // (reusing easeInOutCubic from the reload tilt above) before driving the
  // gun's lerp toward its ADS pose and the camera's FOV toward ADS_FOV.
  // Settles to a no-op once aimProgress reaches its target.
  //
  // isAiming (the effective state used everywhere else) is forced false
  // while sprinting, so sprinting always cancels ADS -- and since it's
  // recomputed fresh every frame, letting go of sprint while the button
  // is still held resumes ADS on its own, no extra state needed.
  function updateAim(deltaSeconds) {
    isAiming = isAimButtonHeld && !isSprinting;

    const aimTarget = isAiming ? 1 : 0;
    if (aimProgress === aimTarget) return;

    const step = deltaSeconds / ADS_TRANSITION_DURATION;
    aimProgress =
      aimProgress < aimTarget
        ? Math.min(aimTarget, aimProgress + step)
        : Math.max(aimTarget, aimProgress - step);

    const eased = easeInOutCubic(aimProgress);

    gunAdsPosition.lerpVectors(HIP_FIRE_GUN_POSITION, ADS_GUN_POSITION, eased);
    gunAdsRotationY =
      HIP_FIRE_GUN_ROTATION_Y + (ADS_GUN_ROTATION_Y - HIP_FIRE_GUN_ROTATION_Y) * eased;

    camera.fov = NORMAL_FOV + (ADS_FOV - NORMAL_FOV) * eased;
    camera.updateProjectionMatrix();
  }

  // Recoil: fired once per shot (from fireWeapon), kicks the gun's pitch
  // up and punches it back toward the camera. updateRecoil decays both
  // back toward 0 every frame, same rate-based lerp as CROUCH_TRANSITION_SPEED.
  function applyRecoil() {
    gunRecoilPitchX += RECOIL_KICK_PITCH;
    gunRecoilKickZ += RECOIL_KICK_KICKBACK;
  }

  function updateRecoil(deltaSeconds) {
    const recoverAmount = Math.min(1, RECOIL_RECOVERY_SPEED * deltaSeconds);
    gunRecoilPitchX += (0 - gunRecoilPitchX) * recoverAmount;
    gunRecoilKickZ += (0 - gunRecoilKickZ) * recoverAmount;
  }

  // Gun bob: phase advances with distance traveled (current horizontal
  // speed * dt), so it naturally speeds up while sprinting without a
  // separate sprint flag -- reuses the same `velocity` vector updateMovement
  // maintains. Only active while grounded; amplitude eases toward its
  // target (0 when airborne/standing still, scaling up with speed otherwise)
  // rather than snapping, so starting/stopping/landing doesn't pop.
  let gunBobPhase = 0;
  let gunBobAmplitude = 0;

  function updateGunBob(deltaSeconds) {
    const speed = velocity.length();

    if (isGrounded) {
      gunBobPhase += speed * BOB_FREQUENCY * deltaSeconds;
    }

    const targetAmplitude = isGrounded
      ? Math.min(BOB_MAX_AMPLITUDE_SCALE, speed / WALK_SPEED) * BOB_AMPLITUDE
      : 0;
    gunBobAmplitude +=
      (targetAmplitude - gunBobAmplitude) * Math.min(1, BOB_AMPLITUDE_SMOOTHING * deltaSeconds);

    gunBobOffsetY = Math.sin(gunBobPhase) * gunBobAmplitude;
  }

  // Horizontal physics velocity (x/z only — vertical motion is handled
  // separately by verticalVelocity/gravity/jump below). Input accelerates
  // this vector toward a target speed and friction decays it back down,
  // so momentum carries over between frames and knockback impulses can
  // just be added straight into it.
  const velocity = new THREE.Vector3();

  // Ends the current slide (speed decayed out, key released, or an enemy
  // was hit) and starts the cooldown. Falls through to ordinary crouch/walk
  // movement next frame — still crouch-walking if Ctrl is still held.
  function endSlide() {
    if (!isSliding) return;
    isSliding = false;
    slideCooldown = SLIDE_COOLDOWN_DURATION;
  }

  // Attempts to start a slide from the current forward momentum. Requires
  // forward speed above sprint-walk speed (so standing still, walking,
  // strafing, or moving backward can't trigger it — only sprinting forward,
  // or having just let go of sprint while that speed is still carrying).
  function tryStartSlide() {
    if (isSliding || slideCooldown > 0 || isDead || !isGrounded) return;
    if (document.pointerLockElement !== canvas) return;

    camera.getWorldDirection(forwardVector);
    forwardVector.y = 0;
    forwardVector.normalize();

    const forwardSpeed = velocity.dot(forwardVector);
    if (forwardSpeed < SLIDE_TRIGGER_SPEED) return;

    isSliding = true;
    slideElapsed = 0;
    velocity.setLength(SLIDE_PEAK_SPEED);
  }

  function updateMovement(deltaSeconds) {
    // Only move while pointer is locked (i.e. actively playing).
    if (document.pointerLockElement !== canvas) return;

    // Forward = camera look direction projected onto the ground plane (flatten Y).
    camera.getWorldDirection(forwardVector);
    forwardVector.y = 0;
    forwardVector.normalize();

    // Right = forward x up, giving a ground-plane strafe direction.
    rightVector.crossVectors(forwardVector, worldUp).normalize();

    // Wish direction = the direction input alone wants to move, normalized
    // so diagonal input isn't faster than straight input.
    wishDirection.set(0, 0, 0);
    if (keys.KeyW) wishDirection.add(forwardVector);
    if (keys.KeyS) wishDirection.sub(forwardVector);
    if (keys.KeyD) wishDirection.add(rightVector);
    if (keys.KeyA) wishDirection.sub(rightVector);
    if (wishDirection.lengthSq() > 0) wishDirection.normalize();

    const isCrouching = keys.ControlLeft || keys.ControlRight;
    const isSprintKeyHeld = keys.ShiftLeft || keys.ShiftRight;
    // Sprinting is disabled while crouching (and while sliding, below).
    // Assigns the shared isSprinting (declared above with the other aim
    // state) rather than declaring a local -- updateAim reads it to cancel ADS.
    isSprinting = isSprintKeyHeld && !isCrouching;

    if (slideCooldown > 0) {
      slideCooldown = Math.max(0, slideCooldown - deltaSeconds);
    }

    let maxSpeed = WALK_SPEED;
    if (isCrouching) {
      maxSpeed = WALK_SPEED * CROUCH_SPEED_MULTIPLIER;
    } else if (isSprinting) {
      maxSpeed = WALK_SPEED * SPRINT_MULTIPLIER;
    }

    // Smoothly lerp eye height toward the standing or crouching target.
    // Sliding shares the crouched pose, so this also covers sliding --
    // using isSliding rather than isCrouching here so the lowered pose
    // holds for the whole slide even though Ctrl is only tapped, not held.
    const targetEyeHeight = (isCrouching || isSliding) ? CROUCH_EYE_HEIGHT : EYE_HEIGHT;
    currentEyeHeight +=
      (targetEyeHeight - currentEyeHeight) *
      Math.min(1, CROUCH_TRANSITION_SPEED * deltaSeconds);

    if (isSliding) {
      // Speed follows a fixed decay curve from the peak down to walk speed
      // over SLIDE_DECAY_DURATION, rather than physics-based friction --
      // ease-out, so it sheds speed fastest right after the peak and eases
      // into walk speed near the end instead of a straight-line bleed.
      slideElapsed += deltaSeconds;
      const t = Math.min(1, slideElapsed / SLIDE_DECAY_DURATION);
      const eased = 1 - (1 - t) * (1 - t);
      const targetSpeed = SLIDE_PEAK_SPEED - (SLIDE_PEAK_SPEED - WALK_SPEED) * eased;

      // Limited steering: nudge the slide's direction toward the wish
      // direction without touching its speed, so it can be aimed slightly
      // but never fully redirected (no instant 90-degree turns).
      slideDirectionScratch.copy(velocity);
      if (slideDirectionScratch.lengthSq() > 0) slideDirectionScratch.normalize();
      if (wishDirection.lengthSq() > 0) {
        slideDirectionScratch.lerp(wishDirection, Math.min(1, SLIDE_STEER_RATE * deltaSeconds)).normalize();
      }
      velocity.copy(slideDirectionScratch).multiplyScalar(targetSpeed);

      // Auto-end once the decay curve finishes.
      if (t >= 1) {
        endSlide();
      }
    } else {
      // Friction: bleed off existing velocity every frame (this is what
      // makes knockback and stopping-on-release feel physical instead of
      // instantaneous).
      const currentSpeed = velocity.length();
      if (currentSpeed > 0) {
        const drop = currentSpeed * FRICTION * deltaSeconds;
        velocity.multiplyScalar(Math.max(currentSpeed - drop, 0) / currentSpeed);
      }

      // Acceleration: steer velocity toward maxSpeed along the wish direction
      // (classic Quake-style accelerate, so turning/starting/stopping has
      // momentum rather than snapping to a fixed speed).
      if (wishDirection.lengthSq() > 0) {
        const currentSpeedInWishDir = velocity.dot(wishDirection);
        const addSpeed = maxSpeed - currentSpeedInWishDir;
        if (addSpeed > 0) {
          const accelSpeed = Math.min(ACCELERATION * deltaSeconds * maxSpeed, addSpeed);
          velocity.addScaledVector(wishDirection, accelSpeed);
        }
      }
    }

    // Sub-stepped so a large single-frame displacement (fast slide, or a
    // big delta after a stalled frame) can't tunnel through a thin wall --
    // see moveWithWallCollision above.
    moveWithWallCollision(camera.position, velocity.x * deltaSeconds, velocity.z * deltaSeconds, PLAYER_RADIUS);

    // Gravity / jumping: integrate a vertical offset above the current
    // stand/crouch eye height and clamp it back to the ground.
    verticalVelocity += GRAVITY * deltaSeconds;
    jumpOffset += verticalVelocity * deltaSeconds;

    if (jumpOffset <= 0) {
      jumpOffset = 0;
      verticalVelocity = 0;
      isGrounded = true;
    } else {
      isGrounded = false;
    }

    camera.position.y = currentEyeHeight + jumpOffset;

    // Generous outer boundary clamp so the player can't wander off the
    // ground plane through the floor plan's open gap.
    const halfSize = PLATFORM_SIZE / 2 - PLAYER_MARGIN;
    camera.position.x = Math.max(-halfSize, Math.min(halfSize, camera.position.x));
    camera.position.z = Math.max(-halfSize, Math.min(halfSize, camera.position.z));
  }

  // ------------------------------------------------------------------
  // ENEMY AI: walk toward the player, and knock the player back + deal
  // damage on periodic contact "ticks" while touching.
  // ------------------------------------------------------------------
  const enemyToPlayer = new THREE.Vector3();
  // Below this, enemyToPlayer is too close to normalize meaningfully --
  // guards both the movement/turn step and the knockback direction below.
  const MIN_ENEMY_DISTANCE = 0.0001;

  // Drives every live enemy's chase/turn/contact-damage behavior. Each
  // enemy carries its own yaw/speed/sizeScale/hitCooldown (see spawnEnemy
  // above), so this is the same per-enemy logic the old single-enemy
  // version had, just run once per entry in `enemies`.
  function updateEnemies(deltaSeconds) {
    if (isDead) return;
    // Only chase while the player is actually playing.
    if (document.pointerLockElement !== canvas) return;

    for (const enemyState of enemies) {
      const mesh = enemyState.mesh;

      enemyToPlayer.set(
        camera.position.x - mesh.position.x,
        0,
        camera.position.z - mesh.position.z
      );
      const distance = enemyToPlayer.length();
      // A bigger/smaller enemy (see sizeScale, spawnEnemy above) reaches
      // proportionally further/less far, rather than every enemy sharing
      // one fixed contact range regardless of its actual size.
      const contactDistance = ENEMY_CONTACT_DISTANCE * enemyState.sizeScale;

      // Running into an enemy while sliding cancels the slide immediately
      // (and starts its cooldown), independent of the damage-tick timing.
      if (isSliding && distance < contactDistance) {
        endSlide();
      }

      if (distance > MIN_ENEMY_DISTANCE) {
        enemyToPlayer.normalize();
        // Same sub-stepped wall collision as the player (see
        // moveWithWallCollision above) -- otherwise enemies chase straight
        // through walls instead of being blocked by them. Radius scales
        // with the enemy's own sizeScale, same as its rendered size.
        const enemyRadius = (ENEMY_SIZE.width / 2) * enemyState.sizeScale;
        moveWithWallCollision(
          mesh.position,
          enemyToPlayer.x * enemyState.speed * deltaSeconds,
          enemyToPlayer.z * enemyState.speed * deltaSeconds,
          enemyRadius
        );

        // Turn toward the player at a limited rate instead of snapping
        // instantly, so a fast-moving player can outrun the enemy's aim
        // for a few frames before it locks back on. Local +Z is "forward"
        // (see the face plane's placement above), so the yaw that points
        // +Z at enemyToPlayer is atan2(x, z) of that (already-normalized)
        // direction vector.
        const targetYaw = Math.atan2(enemyToPlayer.x, enemyToPlayer.z);
        let angleDiff = targetYaw - enemyState.yaw;
        // Wrap to [-PI, PI] so it always turns the short way around.
        angleDiff = ((angleDiff + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;

        const maxStep = ENEMY_TURN_SPEED * deltaSeconds;
        if (Math.abs(angleDiff) <= maxStep) {
          enemyState.yaw = targetYaw;
        } else {
          enemyState.yaw += Math.sign(angleDiff) * maxStep;
        }
        mesh.rotation.y = enemyState.yaw;
      }
      mesh.position.y = (ENEMY_SIZE.height / 2) * enemyState.sizeScale;

      if (enemyState.hitCooldown > 0) {
        enemyState.hitCooldown -= deltaSeconds;
      }

      if (distance < contactDistance && enemyState.hitCooldown <= 0) {
        takeDamage(ENEMY_DAMAGE_PER_HIT);

        // Knockback: shove the player's velocity directly away from the
        // enemy (enemyToPlayer already points from enemy -> player). It
        // feeds into the same physics velocity as movement, so friction
        // naturally bleeds it off over the next moment.
        if (distance > MIN_ENEMY_DISTANCE) {
          velocity.addScaledVector(enemyToPlayer, KNOCKBACK_STRENGTH);
        }

        enemyState.hitCooldown = ENEMY_HIT_INTERVAL;
      }
    }
  }

  // ------------------------------------------------------------------
  // WAVE MANAGER: a small state machine --
  //   grace     -- counting down to the next wave (INITIAL_GRACE_PERIOD
  //                the very first time, BETWEEN_WAVE_GRACE_PERIOD after
  //                that), waveNumber not yet incremented for the wave
  //                that's about to start.
  //   spawning  -- staggering out `waveNumber` enemies, one every
  //                ENEMY_SPAWN_STAGGER_DELAY seconds (the first spawns
  //                immediately on entering this state).
  //   active    -- all of the wave's enemies are out; waiting for
  //                `enemies` to empty out to declare the wave cleared.
  // waveNumber starts at 0 (no wave has spawned yet) and becomes 1 the
  // moment wave 1 actually starts spawning, incrementing the same way
  // for every wave after -- "after each grace period ends" per spec,
  // not the instant the previous wave's last enemy dies.
  // ------------------------------------------------------------------
  let waveNumber = 0;
  let waveState = "grace";
  let waveTimer = INITIAL_GRACE_PERIOD;
  let enemiesRemainingToSpawn = 0;
  let waveEnemiesSpawnedSoFar = 0; // reset whenever a wave starts spawning; drives which spawn is the green enemy

  const waveHudTextEl = document.getElementById("wave-hud-text");

  function updateWaveHudUI() {
    if (waveState === "grace") {
      const nextWaveNumber = waveNumber + 1;
      waveHudTextEl.textContent =
        "Wave " + nextWaveNumber + " in " + Math.ceil(waveTimer) + "s";
    } else {
      waveHudTextEl.textContent = "Wave " + waveNumber;
    }
  }

  function updateWaveManager(deltaSeconds) {
    // Paused (not just "no new spawns" but the whole state machine frozen)
    // while the death screen is up, same as updateEnemies above.
    if (isDead) return;

    if (waveState === "grace") {
      waveTimer -= deltaSeconds;
      if (waveTimer <= 0) {
        waveNumber += 1;
        waveState = "spawning";
        enemiesRemainingToSpawn = Math.min(2 * waveNumber, MAX_ENEMIES_PER_WAVE);
        waveEnemiesSpawnedSoFar = 0;
        waveTimer = 0; // spawn the wave's first enemy immediately below
      } else {
        updateWaveHudUI();
        return;
      }
    }

    if (waveState === "spawning") {
      waveTimer -= deltaSeconds;
      if (waveTimer <= 0) {
        // Exactly one green enemy per wave from GREEN_ENEMY_START_WAVE on
        // -- always the first one spawned that wave, the rest are normal.
        const isGreenEnemy = waveNumber >= GREEN_ENEMY_START_WAVE && waveEnemiesSpawnedSoFar === 0;
        spawnEnemyFromRandomSpawner(isGreenEnemy);
        waveEnemiesSpawnedSoFar += 1;
        enemiesRemainingToSpawn -= 1;
        if (enemiesRemainingToSpawn <= 0) {
          waveState = "active";
        } else {
          waveTimer = ENEMY_SPAWN_STAGGER_DELAY;
        }
      }
      updateWaveHudUI();
      return;
    }

    // waveState === "active": the grace period for the NEXT wave starts
    // the instant this check first sees the wave's last enemy gone --
    // i.e. right here, driven by enemies actually dying (via damageEnemy
    // -> removeEnemy above), never by a fixed timer independent of that.
    if (enemies.length === 0) {
      waveState = "grace";
      waveTimer = BETWEEN_WAVE_GRACE_PERIOD;
    }
    updateWaveHudUI();
  }

  // ------------------------------------------------------------------
  // WINDOW RESIZE
  // ------------------------------------------------------------------
  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ------------------------------------------------------------------
  // ANIMATION LOOP (delta-time based)
  // ------------------------------------------------------------------
  const clock = new THREE.Clock();

  updateHealthUI();
  updateAmmoUI();
  updateWaveHudUI();

  function animate() {
    requestAnimationFrame(animate);

    const deltaSeconds = Math.min(clock.getDelta(), 0.1); // clamp large gaps (e.g. tab switch)

    updateMovement(deltaSeconds);
    updateEnemies(deltaSeconds);
    updateWaveManager(deltaSeconds);
    updateReload(deltaSeconds);
    updateAim(deltaSeconds);
    updateRecoil(deltaSeconds);
    updateGunBob(deltaSeconds);
    applyGunTransform();
    updateHitMarker(deltaSeconds);
    updateParticleBursts(deltaSeconds);
    updateAmmoPickups(deltaSeconds);

    // Keep the sun's shadow target roughly centered on the player.
    sunLight.target.position.set(camera.position.x, 0, camera.position.z);
    sunLight.position.set(
      camera.position.x + 30,
      40,
      camera.position.z + 20
    );

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body>
</html>
